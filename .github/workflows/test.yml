name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

jobs:
  validate_sample:
    name: Validate sample project
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sample
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3

      - name: Spec drift check
        working-directory: .
        run: |
          SAMPLE_CHANGED=$(git diff --name-only origin/develop...HEAD -- sample/ | wc -l)
          SPECS_CHANGED=$(git diff --name-only origin/develop...HEAD -- specs/ | wc -l)
          if [ "$SAMPLE_CHANGED" -gt 0 ] && [ "$SPECS_CHANGED" -eq 0 ]; then
            echo "::warning::sample/ changed but specs/ was not updated — review if specs/generation-prompt.md still matches."
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build runner (generated code)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze .

      - name: Unit + widget tests
        run: flutter test

      - name: Build Android APK (staging flavor)
        run: flutter build apk --debug --flavor staging -t lib/main.dart

      - name: Build iOS (staging flavor, no codesign)
        run: flutter build ios --debug --no-codesign --flavor staging -t lib/main.dart
