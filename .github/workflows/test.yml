name: CI
on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  validate_sample:
    name: Validate sample project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v3

      - name: Set up Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'

      - name: Check for spec drift
        run: |
          SAMPLE_CHANGED=$(git diff --name-only origin/develop...HEAD -- sample/ | wc -l)
          SPECS_CHANGED=$(git diff --name-only origin/develop...HEAD -- specs/ | wc -l)
          if [ "$SAMPLE_CHANGED" -gt 0 ] && [ "$SPECS_CHANGED" -eq 0 ]; then
            echo "::warning::sample/ changed but specs/ was not updated. Please review if specs need updating."
          fi

      - name: Layer 1 — Structural validation
        run: bash specs/validation/validate_structure.sh sample

      - name: Layer 2a — Get Flutter dependencies
        run: cd sample && flutter pub get

      - name: Layer 2b — Run code generator
        run: cd sample && flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Layer 2c — Check formatting
        run: cd sample && dart format --set-exit-if-changed .

      - name: Layer 2d — Static analysis
        run: cd sample && flutter analyze .

      - name: Layer 3 — Architecture invariants
        run: |
          cp specs/validation/invariant_architecture_test.dart sample/test/
          cd sample && flutter test test/invariant_architecture_test.dart
          rm -f test/invariant_architecture_test.dart

      - name: Layer 3b — Run tests
        run: cd sample && flutter test --coverage
